[project]
name = "circuit_mcp"
version = "0.1.0"
description = "Checks circuit derivations against a symbolic ground truth"
requires-python = ">=3.12"
dependencies = [
  "control>=0.10.2",
  "fastapi>=0.116",
  "lcapy>=1.26",
  "mcp>=1.2",
  "numpy>=2",
  "pyvisa>=1.15",
  "pyvisa-py>=0.8",
  "pyserial>=3.5",
  "pyusb>=1.3",
  "pypdf>=6",
  "python-multipart>=0.0.20",
  "zeroconf>=0.147",
  "scipy>=1.14",
  "sympy>=1.14",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/circuit_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::UserWarning"]
